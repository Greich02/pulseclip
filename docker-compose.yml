services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pulseclip
      POSTGRES_PASSWORD: pulseclip
      POSTGRES_DB: pulseclip
    ports:
      - "5432:5432"
    volumes:
      - pulseclip-db:/var/lib/postgresql/data

volumes:
  pulseclip-db:
